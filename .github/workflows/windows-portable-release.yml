name: Windows portable release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Synchronize version metadata
        run: node scripts/sync-version.mjs

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Check frontend
        run: npm run check

      - name: Build Windows executable
        run: npm run tauri -- build --no-bundle --ci

      - name: Package portable ZIP
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $tagVersion = $env:GITHUB_REF_NAME -replace '^v', ''
          if ($tagVersion -ne $version) {
            throw "Release tag version '$tagVersion' does not match VERSION '$version'."
          }
          $packageVersion = (node -p "require('./package.json').version").Trim()
          $cargoVersion = (Select-String -Path src-tauri\Cargo.toml -Pattern '^version = "([^"]+)"' | Select-Object -First 1).Matches.Groups[1].Value
          $tauriVersion = (Get-Content src-tauri\tauri.conf.json -Raw | ConvertFrom-Json).version
          if ($version -ne $packageVersion -or $version -ne $cargoVersion -or $version -ne $tauriVersion) {
            throw "Version metadata does not match VERSION '$version'."
          }

          $executable = "src-tauri/target/release/eefi-browser.exe"
          if (-not (Test-Path $executable)) {
            throw "Release executable was not produced: $executable"
          }
          Copy-Item $executable (Join-Path $env:GITHUB_WORKSPACE "eefi-browser-$version-windows-x64.exe")

          $packageDirectory = Join-Path $env:RUNNER_TEMP "eefi-browser"
          New-Item -ItemType Directory -Force -Path $packageDirectory | Out-Null
          Copy-Item $executable (Join-Path $packageDirectory "Eefi Browser.exe")

          $readme = @(
            "Eefi Browser $version - Windows x64"
            ""
            "To run:"
            "1. Extract the entire ZIP."
            '2. Run "Eefi Browser.exe".'
            ""
            "Requirement:"
            "Microsoft Edge WebView2 Evergreen Runtime is required. It is included on most"
            "current Windows 10 and Windows 11 installations. If Eefi Browser does not start,"
            "install the Evergreen Runtime from:"
            "https://developer.microsoft.com/microsoft-edge/webview2/"
            ""
            "This is an early-development, unsigned build. Windows may show a SmartScreen"
            "warning. The browser UI is bundled in the executable; Vite is not required."
            ""
            "After installing an updater-enabled release, use Settings > Updates to check"
            "for newer stable or beta builds without manually downloading each ZIP."
          )
          $readme | Set-Content -Encoding utf8 (Join-Path $packageDirectory "README.txt")

          $zipPath = Join-Path $env:GITHUB_WORKSPACE "eefi-browser-$version-windows-x64.zip"
          Compress-Archive -Path (Join-Path $packageDirectory "*") -DestinationPath $zipPath

      - name: Prepare release notes
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $tagVersion = $env:GITHUB_REF_NAME -replace '^v', ''
          if ($tagVersion -ne $version) {
            throw "Release tag version '$tagVersion' does not match VERSION '$version'."
          }

          $changelogLines = Get-Content CHANGELOG.md
          $headingPattern = '^## \[' + [regex]::Escape($version) + '\](?:\s|$)'
          $sectionStart = -1
          for ($i = 0; $i -lt $changelogLines.Length; $i++) {
            if ($changelogLines[$i] -match $headingPattern) {
              $sectionStart = $i
              break
            }
          }
          if ($sectionStart -lt 0) {
            throw "CHANGELOG.md has no release section for version '$version'."
          }

          $sectionEnd = $changelogLines.Length
          for ($i = $sectionStart + 1; $i -lt $changelogLines.Length; $i++) {
            if ($changelogLines[$i] -match '^## \[') {
              $sectionEnd = $i
              break
            }
          }
          $changelogEntries = [System.Collections.Generic.List[string]]::new()
          for ($i = $sectionStart + 1; $i -lt $sectionEnd; $i++) {
            $changelogEntries.Add($changelogLines[$i])
          }
          $changelog = ($changelogEntries -join "`n").Trim()
          if (-not $changelog) {
            throw "CHANGELOG.md release section for '$version' is empty."
          }

          $previousTag = git describe --tags --abbrev=0 "$env:GITHUB_SHA^"
          if ($LASTEXITCODE -ne 0 -or -not $previousTag) {
            throw "Could not find the previous Git tag for '$env:GITHUB_REF_NAME'."
          }
          $compareUrl = "https://github.com/$env:GITHUB_REPOSITORY/compare/$previousTag...$env:GITHUB_REF_NAME"
          $notes = @"
          **eefi Browser v$version**

          > This is an early-development build. Expect bugs and features to be missing.
          > If you have any issues, report it in the [GitHub issues page](https://github.com/$env:GITHUB_REPOSITORY/issues) or in the [discord server](https://discord.gg/unmX7BXuB8).

          ### Changelog

          $changelog

          ### Requirement
          Microsoft Edge WebView2 Evergreen Runtime is required. It is included on most current Windows 10 and Windows 11 installations. If eefi Browser does not start, install the Evergreen Runtime from: https://developer.microsoft.com/microsoft-edge/webview2/

          ### Downloads
          | Platform | Download |
          | --- | --- |
          | Windows x64 .EXE | ``eefi-browser-$version-windows-x64.exe`` |
          | Windows x64 .ZIP | ``eefi-browser-$version-windows-x64.zip`` |

          **Full changelog:** [$previousTag...$env:GITHUB_REF_NAME]($compareUrl)
          "@
          $notesPath = Join-Path $env:GITHUB_WORKSPACE "release-notes.md"
          [System.IO.File]::WriteAllText($notesPath, $notes.Trim() + "`n", [System.Text.UTF8Encoding]::new($false))

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          name: eefi Browser ${{ github.ref_name }}
          body_path: release-notes.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            eefi-browser-*-windows-x64.zip
            eefi-browser-*-windows-x64.exe
