[package]
name = "eefi-browser"
version = "0.1.0"
description = "A lightweight desktop browser built with Tauri and WebView2"
authors = ["Eefi Browser"]
edition = "2021"
license = "GPL-3.0-or-later"

[features]
live-verification = []

[lib]
name = "eefi_browser_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
adblock = { version = "0.13.6", default-features = false, features = ["resource-assembler"] }
serde_json = "1"
tauri-build = { version = "2", features = [] }

[dependencies]
adblock = { version = "0.13.6", default-features = false, features = ["embedded-domain-resolver", "full-regex-handling"] }
futures-util = "0.3"
psl = "2"
rusqlite = { version = "0.37", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["unstable", "devtools"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tokio = { version = "1", features = ["sync", "time"] }
url = "2"
zeroize = "1"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39.1"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_Com"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
